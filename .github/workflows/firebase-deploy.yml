name: Deploy App and Release APK

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Bump Version to Timestamp
        run: |
          echo "{\"version\": $(date +%s)}" > public/version.json
          cat public/version.json

      - name: Build Web App
        run: npm run build

      - name: Zip dist folder for OTA
        run: |
          cd dist
          zip -r ../dist.zip .
          cd ..
          mv dist.zip dist/dist.zip

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy to Firebase Hosting
        run: firebase deploy --only hosting --token "${{ secrets.FIREBASE_TOKEN }}" --non-interactive

      - name: Build Android APK
        run: |
          npm run android:sync
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Create GitHub Release and Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ github.run_number }}"
          name: "Update v${{ github.run_number }}"
          files: android/app/build/outputs/apk/debug/app-debug.apk
